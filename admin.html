<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <h1>🛍️ Kushi Collection — customer Orders</h1>

    <style>
        
            body {
                padding: 15px;
            }
            .order {
                padding: 15px;
            }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .order {
    background: white;
    margin: 20px 0;
    padding: 20px;
    border-radius: 10px;
    border-left: 5px solid #333;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}
    button {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}
    button:hover {
        opacity: 0.8;
    }
    #searchInput {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
}
select {
    padding: 8px;
    font-size: 14px;
    border-radius: 5px;
    cursor: pointer;
}
/* Mobile friendly */
@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 24px;
    }

    .order {
        margin: 15px 0;
        padding: 15px;
    }

    .order p {
        font-size: 14px;
        word-wrap: break-word;
    }

    #searchInput {
        font-size: 14px;
        padding: 10px;
    }

    select {
        width: 100%;
        margin-top: 5px;
    }

    button {
        width: 100%;
        margin-top: 10px;
    }
}
.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.dashboard p {
    background: white;
    padding: 20px;
    margin: 0;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
}
.dashboard p:hover {
    transform: translateY(-3px);
    transition: 0.2s;
}

@media (max-width: 600px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
}
.statusSelect {
    font-weight: bold;
    padding: 8px;
    border-radius: 5px;
}

.statusSelect option[value="Pending"] {
    color: orange;
}

.statusSelect option[value="Shipped"] {
    color: blue;
}

.statusSelect option[value="Delivered"] {
    color: green;
}
        .order h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    
    <button onclick="loadOrders()">🔄 Refresh Orders</button>
    <div class="dashboard">
    <p id="ordersCount">Total Orders: 0</p>
    <p id="pendingCount">Pending Orders: 0</p>
    <p id="shippedCount">Shipped Orders: 0</p>
    <p id="deliveredCount">Delivered Orders: 0</p>
    <p id="productsCount">Products Sold: 0</p>
    <p id="revenueCount">Total Revenue: ₹0</p>
    </div>
    <input
    type="text"
    id="searchInput"
    placeholder="Search by customer name or phone number ..."
    oninput="searchOrders()"
>

    <div id="orders">
        Loading orders...
    </div>

    <script>

        async function loadOrders() {

            try {

                const response = await fetch(
                    "http://localhost:5000/api/orders"
                );

                const orders = await response.json();
                let totalRevenue = 0;

orders.forEach(order => {
    if (order.products) {
        order.products.forEach(product => {
            totalRevenue += Number(product.price || 0);
        });
    }
});

document.getElementById("revenueCount").innerText =
    "Total Revenue: ₹" + totalRevenue;
                document.getElementById("ordersCount").innerText = "Total Orders: " + orders.length;
                const pendingOrders = orders.filter(order => order.status === "Pending");
                document.getElementById("pendingCount").innerText = "Pending Orders: " + pendingOrders.length;
                const shippedOrders = orders.filter(order => order.status === "Shipped");
                document.getElementById("shippedCount").innerText = "Shipped Orders: " + shippedOrders.length;
                const deliveredOrders = orders.filter(order => order.status === "Delivered");
                document.getElementById("deliveredCount").innerText = "Delivered Orders: " + deliveredOrders.length;
                let totalProducts = 0;
                

orders.forEach(order => {
    if (order.products) {
        totalProducts += order.products.length;
    }
});

document.getElementById("productsCount").innerText =
    "Products Sold: " + totalProducts;
                const ordersDiv =
                    document.getElementById("orders");

                ordersDiv.innerHTML = "";

                if (orders.length === 0) {

                    ordersDiv.innerHTML =
                        "<p>No orders found.</p>";

                    return;
                }

                orders.forEach(order => {

                    ordersDiv.innerHTML += `

                        <div class="order">
                            <h2>Customer Details</h2>

                            <h3>${order.customerName}</h3>
                            <p><strong>Order ID:</strong> ${order._id}</p>
                            <button onclick="copyOrderId('${order._id}')">
    Copy Order ID
</button>
                            <p><strong>Order Date:</strong> ${order.orderDate || "Not available"}</p>
                            <p>
                              <strong>Status:</strong>
                                <select class="statusSelect"onchange="updateStatus('${order._id}', this.value)">
                                    <option>Pending</option>
                                    <option>Shipped</option>
                                    <option>Delivered</option>
                                </select>
                                </p>
                            <p><strong>Phone:</strong>
                            ${order.customerPhone}</p>

                            <p><strong>Address:</strong>
                            ${order.customerAddress}</p>

                            <p><strong>City:</strong>
                            ${order.customerCity}</p>

                            <p><strong>Pincode:</strong>
                            ${order.customerPincode}</p>
                            <p>product Details</p>
                            <p><strong>Products:</strong></p>
                            
<p>
    ${order.products.map(product =>
        `${product.name} — ₹${product.price} — Quantity: ${product.quantity || 1}`
    ).join("<br>")}
</p>
                            <button onclick="deleteOrder('${order._id}')">Delete Order</button>

                        </div>

                    `;

                });

            } catch (error) {

                console.error(error);

                document.getElementById("orders").innerHTML =
                    "<p>Unable to load orders. Make sure the backend is running.</p>";

            }

        }
async function updateStatus(id, status) {
    try {
        const response = await fetch(
            `http://localhost:5000/api/orders/${id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: status
                })
            }
        );

        const data = await response.json();

        alert(data.message);

        loadOrders();

    } catch (error) {
        console.error(error);
        alert("Failed to update status");
    }
}
async function deleteOrder(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this order?"
    );

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(
            `http://localhost:5000/api/orders/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        alert(data.message);

        loadOrders();

    } catch (error) {

        console.error(error);

        alert("Failed to delete order");

    }
}
function searchOrders() {
    const searchText =
        document.getElementById("searchInput").value
        .toLowerCase();

    const orders =
        document.querySelectorAll(".order");

    orders.forEach(order => {
        const text = order.innerText.toLowerCase();

        if (text.includes(searchText)) {
            order.style.display = "block";
        } else {
            order.style.display = "none";
        }
    });
}
        loadOrders();
    function copyOrderId(id) {
    navigator.clipboard.writeText(id)
        .then(() => {
            alert("Order ID copied!");
        })
        .catch(() => {
            alert("Could not copy Order ID");
        });
}
    </script>
    
    <button onclick="copyOrderId('${order._id}')">
    
</button>

</body>
</html>
